<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jeremy Kastine's teaching materials for TSM, College Algebra, and Statistics.">
  <title>Teaching · Jeremy Kastine</title>
  <style>
    :root { color-scheme: light; --ink: #14232d; --accent: #185f72; --muted: #52616b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f8; color: var(--ink); font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 860px; margin: auto; padding: 64px 28px; }
    .name { margin: 0; color: var(--accent); font-weight: 650; }
    h1 { margin: 12px 0 24px; font-size: clamp(2.7rem, 8vw, 4rem); line-height: 1.1; letter-spacing: -.04em; }
    header { margin-bottom: 42px; }
    header p:last-child { color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid #c7d2d7; }
    a { display: block; padding: 28px 0; color: var(--ink); text-decoration: none; }
    .course { display: block; color: var(--accent); font-size: 1.45rem; font-weight: 700; }
    .description { display: block; margin-top: 5px; color: var(--muted); }
    a:hover .course { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #b05819; outline-offset: 5px; }
    footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid #c7d2d7; color: var(--muted); font-size: .85rem; }
    @media (max-width: 520px) { main { padding: 36px 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="name">Jeremy Kastine</p>
      <h1>Teaching</h1>
      <p>Choose a course to open its teaching materials.</p>
    </header>
    <nav aria-label="Course materials">
      <ul>
        <li><a href="https://jeremykastine.github.io/tsm/index.html"><span class="course">TSM 098 / 099</span><span class="description">Transitional mathematics · Lecture notes</span></a></li>
        <li><a href="https://jeremykastine.github.io/101/index.html"><span class="course">MATH 101</span><span class="description">College Algebra · Class slides</span></a></li>
        <li><a href="https://jeremykastine.github.io/stats/index.html"><span class="course">Statistics</span><span class="description">Class slides</span></a></li>
      </ul>
    </nav>
    <footer>Course materials by Jeremy Kastine</footer>
  </main>
</body>
</html>
